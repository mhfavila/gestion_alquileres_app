spring:
  application:
    name: gestion-alquileres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestion_alquileres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: favila
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: always
      continue-on-error: false

app:
  security:
    pin: ${APP_SECRET_PIN:1234}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

logging:
  level:
    com.gestion.alquileres: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
