server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback para rutas de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy hacia el backend Spring Boot conservando cabeceras de contexto y PIN
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Context-Id $http_x_context_id;
        proxy_set_header X-App-Pin $http_x_app_pin;
        proxy_pass_request_headers on;
    }
}
